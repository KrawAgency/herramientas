<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Consultas Places</title>
<style>
:root{--fondo:#f6f6f8;--tarjeta:#fff;--texto:#1c1c22;--suave:#5f5f6b;--linea:#d9d9e0;--marca:#4b4fd6;--error:#b3261e;--ok:#1b7f4b}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--fondo:#14141a;--tarjeta:#1f1f27;--texto:#efeff4;--suave:#a8a8b5;--linea:#363642;--marca:#9a9dff;--error:#ff8a80;--ok:#6fd6a0}}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--texto);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:.2rem 0}
p{margin:.4rem 0}
.suave{color:var(--suave);font-size:.9rem}
section{background:var(--tarjeta);border:1px solid var(--linea);border-radius:12px;padding:14px;margin-top:12px}
label{display:block;font-weight:600;margin-bottom:6px}
input{width:100%;font:inherit;padding:11px;border:1px solid var(--linea);border-radius:8px;background:transparent;color:inherit}
button{font:inherit;font-weight:600;padding:12px 14px;border-radius:8px;border:1px solid var(--marca);background:var(--marca);color:var(--tarjeta);width:100%;margin-top:8px;cursor:pointer}
button.sec{background:transparent;color:var(--marca)}
button:disabled{opacity:.5;cursor:default}
progress{width:100%;height:12px}
.datos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:10px 0}
.datos b{display:block;font-size:1.3rem}
#mensaje{min-height:1.4em;margin-top:8px}
#mensaje.error{color:var(--error);font-weight:600}
#mensaje.ok{color:var(--ok);font-weight:600}
</style>
</head>
<body>
<main>
  <h1>Consultas Places</h1>
  <p class="suave">20 búsquedas en 2 zonas, con tope de 100 consultas. Tu clave no se guarda: al recargar hay que volver a escribirla.</p>

  <section>
    <label for="clave">Clave de Places API</label>
    <input id="clave" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="probar">Probar con 1 consulta</button>
    <button id="correr" class="sec">Correr lo que falta</button>
    <button id="parar" class="sec" disabled>Pausar</button>
    <p id="mensaje" role="status"></p>
  </section>

  <section>
    <progress id="barra" max="100" value="0"></progress>
    <div class="datos">
      <div><b id="usadas">0</b><span class="suave">consultas</span></div>
      <div><b id="negocios">0</b><span class="suave">negocios</span></div>
      <div><b id="faltan">0</b><span class="suave">búsquedas por hacer</span></div>
    </div>
    <p id="actual" class="suave"></p>
    <button id="bajar" disabled>Bajar CSV</button>
    <button id="borrar" class="sec">Borrar todo y empezar de nuevo</button>
  </section>

  <p class="suave">Datos de Google Maps. Lista de trabajo interna: no se publica.</p>
</main>

<script>
const TOPE = 100;
const LLAVE = 'kraw-places-v1';
const URL_API = 'https://places.googleapis.com/v1/places:searchText';
const CAMPOS = ['places.id','places.displayName','places.formattedAddress','places.nationalPhoneNumber','places.internationalPhoneNumber','places.websiteUri','places.rating','places.userRatingCount','places.businessStatus','places.googleMapsUri','places.primaryTypeDisplayName','places.regularOpeningHours.weekdayDescriptions','places.location','nextPageToken'].join(',');

// Rectángulos aproximados del alcance: prospectos/alcance-places-2026-11-04.md
const ZONAS = [
  {nombre:'Puerto Morelos y Ruta de los Cenotes', paginas:2, low:{latitude:20.78,longitude:-87.22}, high:{latitude:21.02,longitude:-86.86}},
  {nombre:'Cancún centro-sur', paginas:3, low:{latitude:21.08,longitude:-86.89}, high:{latitude:21.165,longitude:-86.81}}
];
const BUSQUEDAS = [
  ['Salud','veterinaria'],['Salud','dentista'],['Salud','consultorio médico'],['Salud','fisioterapia'],
  ['Tours','tours cenotes'],['Tours','pesca deportiva'],['Tours','tours snorkel'],['Tours','buceo'],['Tours','operador de tours'],
  ['Belleza','barbería'],['Belleza','salón de belleza'],['Belleza','salón de uñas'],
  ['Hospedaje chico','hostal'],['Hospedaje chico','bed and breakfast'],['Hospedaje chico','casa de huéspedes'],
  ['Oficios','plomero'],['Oficios','electricista'],['Oficios','servicio de aire acondicionado'],['Oficios','mantenimiento de albercas'],['Oficios','jardinería']
];
const PLAN = ZONAS.flatMap(z => BUSQUEDAS.map(([giro,termino]) => ({id:z.nombre+'|'+termino, zona:z, giro, termino})));

const $ = id => document.getElementById(id);
let parar = false, corriendo = false;

function nuevoEstado(){ return {usadas:0, progreso:{}, negocios:{}}; }
function cargar(){
  try { return JSON.parse(localStorage.getItem(LLAVE)) || nuevoEstado(); }
  catch(e){ return nuevoEstado(); }
}
let estado = cargar();
function guardar(){ try { localStorage.setItem(LLAVE, JSON.stringify(estado)); } catch(e){} }

function terminada(b){ const p = estado.progreso[b.id]; return !!(p && p.fin); }
function pendientes(){ return PLAN.filter(b => !terminada(b)); }

function pintar(){
  $('barra').value = estado.usadas;
  $('usadas').textContent = estado.usadas;
  $('negocios').textContent = Object.keys(estado.negocios).length;
  $('faltan').textContent = pendientes().length;
  const hay = Object.keys(estado.negocios).length > 0;
  $('bajar').disabled = !hay;
  const libre = !corriendo && estado.usadas < TOPE && pendientes().length > 0;
  $('probar').disabled = !libre;
  $('correr').disabled = !libre;
  $('parar').disabled = !corriendo;
  $('borrar').disabled = corriendo;
}
function aviso(texto, tipo){ $('mensaje').textContent = texto; $('mensaje').className = tipo || ''; }

function anotar(lugar, b){
  const previo = estado.negocios[lugar.id];
  if (previo){
    if (!previo.giros.includes(b.giro)) previo.giros.push(b.giro);
    if (!previo.busquedas.includes(b.termino)) previo.busquedas.push(b.termino);
    if (!previo.zonas.includes(b.zona.nombre)) previo.zonas.push(b.zona.nombre);
    return;
  }
  estado.negocios[lugar.id] = {
    nombre:(lugar.displayName||{}).text||'',
    tipo:(lugar.primaryTypeDisplayName||{}).text||'',
    direccion:lugar.formattedAddress||'',
    telefono:lugar.nationalPhoneNumber||'',
    telefono_intl:lugar.internationalPhoneNumber||'',
    sitio:lugar.websiteUri||'',
    calificacion:lugar.rating??'',
    resenas:lugar.userRatingCount??'',
    estado:lugar.businessStatus||'',
    maps:lugar.googleMapsUri||'',
    horario:((lugar.regularOpeningHours||{}).weekdayDescriptions||[]).join(' / '),
    lat:(lugar.location||{}).latitude??'',
    lng:(lugar.location||{}).longitude??'',
    giros:[b.giro], busquedas:[b.termino], zonas:[b.zona.nombre],
    fecha:new Date().toISOString().slice(0,10)
  };
}

async function unaConsulta(b, clave){
  const p = estado.progreso[b.id] || {paginas:0};
  const cuerpo = {
    textQuery:b.termino, languageCode:'es', regionCode:'MX', pageSize:20,
    locationRestriction:{rectangle:{low:b.zona.low, high:b.zona.high}}
  };
  if (p.token) cuerpo.pageToken = p.token;
  const r = await fetch(URL_API, {
    method:'POST',
    headers:{'Content-Type':'application/json','X-Goog-Api-Key':clave,'X-Goog-FieldMask':CAMPOS},
    body:JSON.stringify(cuerpo)
  });
  estado.usadas++;
  if (!r.ok){
    guardar();
    let detalle = '';
    try { detalle = ((await r.json()).error||{}).message||''; } catch(e){}
    throw new Error('Google respondió ' + r.status + (detalle ? ': ' + detalle : ''));
  }
  const datos = await r.json();
  (datos.places||[]).forEach(l => anotar(l, b));
  p.paginas++;
  p.token = datos.nextPageToken || null;
  p.fin = !p.token || p.paginas >= b.zona.paginas;
  estado.progreso[b.id] = p;
  guardar();
}

async function correr(limite){
  const clave = $('clave').value.trim();
  if (!clave){ aviso('Escribe la clave primero.', 'error'); return; }
  corriendo = true; parar = false; aviso('Consultando…'); pintar();
  let hechas = 0;
  try {
    while (!parar && hechas < limite && estado.usadas < TOPE){
      const b = pendientes()[0];
      if (!b) break;
      $('actual').textContent = b.termino + ' · ' + b.zona.nombre;
      await unaConsulta(b, clave);
      hechas++;
      pintar();
    }
    $('actual').textContent = '';
    if (!pendientes().length) aviso('Terminó. Baja el CSV.', 'ok');
    else if (estado.usadas >= TOPE) aviso('Llegó al tope de ' + TOPE + ' consultas. Baja el CSV.', 'ok');
    else aviso(limite === 1 ? 'Funcionó. Ya puedes correr lo que falta.' : 'En pausa. Puedes seguir cuando quieras.', 'ok');
  } catch(e){
    aviso(e.message || 'No se pudo consultar. Revisa tu conexión.', 'error');
  }
  corriendo = false; pintar();
}

function celda(v){ return '"' + String(v ?? '').replace(/"/g,'""') + '"'; }
function csv(){
  const cols = ['place_id','nombre','giros','tipo','zonas','busquedas','direccion','telefono','telefono_intl','sitio','calificacion','resenas','estado','maps','horario','lat','lng','fecha'];
  const filas = Object.entries(estado.negocios).map(([id,n]) => cols.map(c => celda(
    c === 'place_id' ? id : Array.isArray(n[c]) ? n[c].join('; ') : n[c]
  )).join(','));
  return '﻿' + cols.join(',') + '\r\n' + filas.join('\r\n') + '\r\n';
}
function bajar(){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv()], {type:'text/csv;charset=utf-8'}));
  a.download = 'places-kraw-' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

$('probar').onclick = () => correr(1);
$('correr').onclick = () => correr(TOPE);
$('parar').onclick = () => { parar = true; };
$('bajar').onclick = bajar;
$('borrar').onclick = () => {
  if (!confirm('¿Borrar los resultados de este teléfono? Baja el CSV antes si lo necesitas.')) return;
  estado = nuevoEstado(); guardar(); aviso(''); pintar();
};
pintar();
</script>
</body>
</html>
