<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Herramientas · Fernando</title>
  <meta name="description" content="Lanzador de mis herramientas">
  <meta name="theme-color" content="#0d1117">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Herramientas">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <style>
    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --hover:    #1c2330;
      --border:   #30363d;
      --text:     #e6edf3;
      --muted:    #7d8590;
      --accent:   #58a6ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100dvh;
      padding: 32px 16px 60px;
    }

    /* Subtle dot grid overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, #30363d 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto 20px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .header-left {}

    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    .tool-count {
      font-size: 12px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 12px;
      white-space: nowrap;
      align-self: center;
    }

    /* ── Categorías y orden ── */
    .toolbar {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px 16px;
    }

    .chips {
      display: flex;
      gap: 6px;
      flex: 1 1 100%;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
      margin: 0 -16px;
      padding: 0 16px;
    }

    .chips::-webkit-scrollbar { display: none; }

    .chip {
      flex: none;
      min-height: 34px;
      padding: 0 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .chip span {
      margin-left: 4px;
      color: var(--muted);
      font-size: 11px;
    }

    .chip:hover { background: var(--hover); }

    .chip[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
      font-weight: 600;
    }

    .chip[aria-pressed="true"] span { color: var(--bg); }

    .chip:focus-visible,
    .sort select:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .sort {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .sort select {
      min-height: 34px;
      padding: 0 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      color-scheme: dark;
      font: inherit;
      font-size: 13px;
    }

    @media (min-width: 780px) {
      .chips {
        flex: 1 1 0;
        flex-wrap: wrap;
        overflow: visible;
        margin: 0;
        padding: 0;
      }
    }

    .group-title {
      grid-column: 1 / -1;
      margin-top: 14px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .group-title:first-child { margin-top: 0; }

    /* ── Grid ── */
    .grid {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (min-width: 540px) {
      .grid { grid-template-columns: repeat(3, 1fr); gap: 14px; }
    }

    @media (min-width: 780px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 16px 16px;
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: background 0.14s ease, border-color 0.14s ease, transform 0.14s ease;
      position: relative;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .card:hover,
    .card:focus-visible {
      background: var(--hover);
      border-color: var(--card-color, var(--border));
      transform: translateY(-2px);
      outline: none;
    }

    /* Color glow top-left */
    .card::before {
      content: '';
      position: absolute;
      top: -24px;
      left: -24px;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: var(--card-color, transparent);
      opacity: 0.11;
      filter: blur(22px);
      transition: opacity 0.2s;
      pointer-events: none;
    }

    .card:hover::before { opacity: 0.2; }

    /* Color bar top edge */
    .card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--card-color, transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .card:hover::after { opacity: 1; }

    .card-icon {
      font-size: 26px;
      line-height: 1;
    }

    .card-name {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.25;
    }

    .card-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
      flex: 1;
    }

    .card-tag {
      margin-top: 4px;
      font-size: 10px;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--card-color, var(--muted));
      opacity: 0.85;
      font-weight: 600;
    }

    /* ── Empty state ── */
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      padding: 40px 0;
    }

    /* ── Footer ── */
    footer {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 36px auto 0;
      font-size: 11px;
      color: var(--muted);
      text-align: right;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <p class="eyebrow">ferkraw</p>
      <h1>Mis herramientas</h1>
    </div>
    <span class="tool-count" id="count">—</span>
  </header>

  <div class="toolbar">
    <div class="chips" id="chips" role="group" aria-label="Categorías"></div>
    <label class="sort">
      Ordenar
      <select id="sort">
        <option value="cat">Por categoría</option>
        <option value="az">A–Z</option>
        <option value="za">Z–A</option>
      </select>
    </label>
  </div>

  <div class="grid" id="grid"></div>

  <footer id="footer"></footer>

  <script>
    // ╔══════════════════════════════════════════════════════╗
    //  EDITA AQUÍ — agrega o quita herramientas del launcher

    //    tag   → categoría; un tag nuevo crea su filtro solo (ej: "Casa", "Trabajo")

        icon:  "🥗",
        color: "#22c55e",
        tag:   "Salud",

      },

      // ── Trabajo ────────────────────────────────────────────
      {
        name:  "Buscador Family Suites",
        desc:  "Búsqueda rápida de suites por categoría",
        icon:  "🏨",
        color: "#3b82f6",
        tag:   "Trabajo",
        url:   "buscador_family_suites.html"
      },
      {
        name:  "Calculadora Adelanto",
        desc:  "Cálculo de adelantos NU",
        icon:  "🧮",
        color: "#a855f7",
        tag:   "Trabajo",
        url:   "calculadora-adelanto-nu.html"
      },
      {
        name:  "Combo Builder",

        icon:  "📦",
        color: "#f59e0b",
        tag:   "Trabajo",
        url:   "combo-builder.html"
      },
      {
        name:  "Constructor Combo",
        desc:  "Constructor de combos avanzado",
        icon:  "🔧",
        color: "#fb923c",
        tag:   "Trabajo",
        url:   "constructor_combo_builder.html"
      },
      {
        name:  "Gift Studio",
        desc:  "Selector de regalos para huéspedes en la tablet",
        icon:  "🎁",
        color: "#e11d48",
        tag:   "Trabajo",
        url:   "https://krawagency.github.io/Gift.Studio/"
      },
      {
        name:  "GuestyLIVE",
        desc:  "Consulta rápida de huéspedes desde los exports del CRM",
        icon:  "🔎",
        color: "#0ea5e9",
        tag:   "Trabajo",
        url:   "https://krawagency.github.io/GuestyLIVE/"
      },
      {
        name:  "Hyatt Calculator",
        desc:  "Calculadora para membresías Hyatt",
        icon:  "🏩",
        color: "#14b8a6",
        tag:   "Trabajo",
        url:   "hyatt_calculator.html"
      },
      {
        name:  "IJ Pickup System",
        desc:  "Sistema de pickup para clientes",
        icon:  "🚐",
        color: "#fb923c",
        tag:   "Trabajo",
        url:   "ij-pickup-system.html"
      },
      {
        name:  "PDF → PPTX Bridge",
        desc:  "Inyecta links y transiciones al deck de Canva",
        icon:  "🔗",
        color: "#6366f1",
        tag:   "Trabajo",
        url:   "pdf_pptx_bridge_v2.html"
      },
      {
        name:  "Pre-Manifiesto",

        icon:  "📋",
        color: "#0ea5e9",
        tag:   "Trabajo",

      },
      {
        name:  "Prospect Tracker",
        desc:  "Seguimiento de prospectos",
        icon:  "👤",
        color: "#22c55e",
        tag:   "Trabajo",
        url:   "prospect-tracker.html"
      },
      {
        name:  "Room Upgrades",
        desc:  "Gestor de upgrades de habitación",
        icon:  "🛏️",
        color: "#8b5cf6",
        tag:   "Trabajo",
        url:   "room-upgrades-v3.html"
      },
      {
        name:  "Spa Menu",
        desc:  "Menú de servicios del spa",
        icon:  "💆",
        color: "#10b981",
        tag:   "Trabajo",
        url:   "spa-menu-v4.html"
      },
      {
        name:  "Vacation Math",
        desc:  "Compara lo pagado contra el mismo viaje con certificado",
        icon:  "🧾",
        color: "#0d9488",
        tag:   "Trabajo",
        url:   "vacation-math.html"
      },
      {
        name:  "VIP PDF Merger",
        desc:  "Fusión de PDFs para presentaciones VIP",

      },

      // ── Utilidades ─────────────────────────────────────
      {
        name:  "Imágenes a PDF",
        desc:  "Convierte imágenes sueltas a un solo PDF",
        icon:  "🖼️",

      },
      {

        desc:  "Agrega margen a un PDF para imprimir y engargolar",
        icon:  "📐",
        color: "#c9a84c",
        tag:   "Utilidad",
        url:   "margenes-pdf.html"
      },
      {
        name:  "PDF Digest",
        desc:  "Convierte un PDF pesado en hojas de contacto y texto",
        icon:  "🗜️",
        color: "#6366f1",
        tag:   "Utilidad",
        url:   "pdf-digest.html"
      },
      {
        name:  "La Cadena",
        desc:  "Rastreador de hábitos con exportar e importar",
        icon:  "⛓️",
        color: "#b45309",
        tag:   "Personal",
        url:   "la-cadena.html"
      },
      {
        name:  "Semana en el comal",
        desc:  "Plan semanal de comidas según el horario rotativo",
        icon:  "🍳",
        color: "#65a30d",
        tag:   "Salud",
        url:   "semana-en-el-comal.html"
      },
      {
        name:  "Kraw Puerto Morelos",
        desc:  "Prototipo de directorio de negocios del pueblo",
        icon:  "🗺️",
        color: "#7c3aed",
        tag:   "Proyecto",
        url:   "kraw-puerto-morelos.html"
      },
      {
        name:  "Rutitas",
        desc:  "Juego de trazar caminos para Android",
        icon:  "🚗",
        color: "#f43f5e",
        tag:   "Juego",
        url:   "rutitas.html"
      },
      {
        name:  "Instagram Grid",
        desc:  "Planeador de grid para Instagram",
        icon:  "📸",
        color: "#f43f5e",
        tag:   "Personal",
        url:   "instagram_grid_planner.html"
      },
      {
        name:  "Final Fantasy I",
        desc:  "Emulador del clásico original de NES",
        icon:  "⚔️",
        color: "#dc2626",
        tag:   "Personal",
        url:   "https://krawagency.github.io/final-fantasy-1/index.html"
      },
      {
        name:  "Formatos de Oración",
        desc:  "Rosario, coronillas y oraciones en PDF para abrir o guardar",
        icon:  "✝️",
        color: "#c08552",
        tag:   "Familia",
        url:   "https://krawagency.github.io/Formatos-de-Oracion-Latin/"
      },
    ];
    // ── Render ─────────────────────────────────────────────
    const grid  = document.getElementById('grid');
    const count = document.getElementById('count');
    const footer = document.getElementById('footer');
    const chips = document.getElementById('chips');
    const sort  = document.getElementById('sort');
    const ALL   = 'Todas';

    // Recuerda la categoría y el orden en este dispositivo
    const saved = {
      get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    };

    const byName = (a, b) => a.name.localeCompare(b.name, 'es');

    // Categorías con su número de herramientas: la más grande primero
    const totals = {};
    tools.forEach(t => { totals[t.tag] = (totals[t.tag] || 0) + 1; });
    const tags = Object.keys(totals)
      .sort((a, b) => totals[b] - totals[a] || a.localeCompare(b, 'es'));

    let currentTag  = tags.includes(saved.get('launcher-tag')) ? saved.get('launcher-tag') : ALL;
    sort.value      = saved.get('launcher-sort') || 'cat';
    if (!sort.value) sort.value = 'cat';

    function addCard(t) {
      const a = document.createElement('a');
      a.href        = t.url;
      a.target      = '_blank';
      a.rel         = 'noopener';
      a.className   = 'card';
      a.style.setProperty('--card-color', t.color);
      a.innerHTML = `
        <div class="card-icon">${t.icon}</div>
        <div class="card-name">${t.name}</div>
        <div class="card-desc">${t.desc}</div>
        <div class="card-tag">${t.tag}</div>
      `;
      grid.appendChild(a);
    }

    function renderTools() {
      grid.innerHTML = '';
      const shown = tools.filter(t => currentTag === ALL || t.tag === currentTag).sort(byName);

      if (sort.value === 'za') shown.reverse();

      if (sort.value === 'cat' && currentTag === ALL) {
        tags.forEach(tag => {
          const title = document.createElement('h2');
          title.className = 'group-title';
          title.textContent = tag;
          grid.appendChild(title);
          shown.filter(t => t.tag === tag).forEach(addCard);
        });
      } else {
        shown.forEach(addCard);
      }

      count.textContent = currentTag !== ALL
        ? `${shown.length} de ${tools.length}`
        : tools.length === 1 ? '1 herramienta' : `${tools.length} herramientas`;

      chips.querySelectorAll('.chip').forEach(c => {
        c.setAttribute('aria-pressed', c.dataset.tag === currentTag);
      });
    }

    if (tools.length === 0) {
      grid.innerHTML = '<p class="empty">Sin herramientas configuradas aún.</p>';
      count.textContent = '0 herramientas';
    } else {
      [ALL, ...tags].forEach(tag => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip';
        b.dataset.tag = tag;
        b.innerHTML = `${tag}<span>${tag === ALL ? tools.length : totals[tag]}</span>`;
        b.addEventListener('click', () => {
          currentTag = tag;
          saved.set('launcher-tag', tag);
          renderTools();
          b.scrollIntoView({ block: 'nearest', inline: 'nearest' });
        });
        chips.appendChild(b);
      });

      sort.addEventListener('change', () => {
        saved.set('launcher-sort', sort.value);
        renderTools();
      });

      renderTools();
    }

    const now = new Date();
    footer.textContent =
      `Actualizado: ${now.toLocaleDateString('es-MX', { day:'2-digit', month:'short', year:'numeric' })}`;

    // ── PWA service worker ──────────────────────────────────
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>

</body>
</html>
